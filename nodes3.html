<html>
    <head>
        <link href="https://googleapis.com" rel="stylesheet">

        <style>
            body {
                margin: 0px;
                background: #050505;
            }

            :root {
                --color-100: #050505;
                --color-150: #0B0B0B;
                --color-200: #111111;   
                --color-300: #232323;
                --color-400: #ffffff;
                --color-active: #386AD7; 
            }

            .container {
                background-color: var(--color-200);
                color: var(--color-400);
                box-sizing: border-box;
                border-radius: 10px;
                padding: 15px;
            }

            .container-button {
                font-family: 'JetBrains Mono', monospace;
                background-color: var(--color-200);
                justify-content: center;
                align-items: center;
                border-radius: 5px;
                display: flex;
            }

            #select-action-panel {
                box-sizing: border-box;  
                position: absolute;
                
                display: flex;
                
                gap: 10px;
                bottom: 50px;
                left: 50%;

                z-index: 1;

                transform: translate(-50%, 0px);
            }

            .panel {
                height: fit-content;
                width:  fit-content;
                display: flex;
                gap: 10px;

                background: var(--color-150);
                padding: 10px;
                border-radius: 15px;
            }

            .panel-separate {
                width: 2px;
                margin: 10px 5px;
                background: var(--color-300);
            }

            .item-panel {
                box-sizing: border-box;
                border-radius: 10px;
                width:  40px;
                height: 40px;

                display: flex;
                justify-content: center;
                align-items: center;

                cursor: pointer;
                user-select: none; 

                color: rgba(255, 255, 255, 0.5);
                font-family: 'JetBrains Mono', monospace;
                font-size: 18px;

                outline: 2px solid var(--color-200);

                transition: all 100ms ease-in-out;
            }

            .item-panel-icon {
                width:  20px;
                height: 20px;
                
                stroke: rgba(255, 255, 255, 0.5);

                transition: all 150ms ease-in-out;
            }
            
            .item-panel:hover {
                background-color: var(--color-200);
                color: rgba(255, 255, 255, 0.75);
            }

            .item-panel:hover .item-panel-icon {
                stroke: rgba(255, 255, 255, 0.75);
            }

            .item-tooltip {
                position: relative;
            }

            .item-tooltip::before {
                content: attr(tooltip-text);
                position: absolute;
                bottom: 125%;
                left: 50%;
                transform: translateX(-50%); 
                
                padding: 8px 12px;
                font-family: 'JetBrains Mono', monospace;
                font-weight: lighter;
                color: #fff;
                background-color: var(--color-200);
                font-size: 14px;
                white-space: nowrap;
                border-radius: 5px;

                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .item-tooltip:hover::before {
                opacity: 1;
            }

            .item-selected {
                background: var(--color-active);
                color: rgba(255, 255, 255, 1);
            }

            .item-selected .item-panel-icon {
                stroke: rgba(255, 255, 255, 1);
            }

            .item-selected:hover {
                background: var(--color-active);   
            }

            .item-selected:hover .item-panel-icon {
                stroke: white;
            }

            /* -------- guide -------- */

            #guide-panel {
                position: absolute;
                
                left:   50%;
                bottom: 120px;
                transform: translate(-50%, 0px);
                
                box-sizing: border-box;
                border-radius: 15px;
                
                width:  470px;
                height: 500px;

                padding: 15px;

                background: var(--color-150);
                backdrop-filter: blur(15px);
                
                transition: all 100ms ease-in-out;
            }

            .guide-hidden {
                pointer-events: none;
                opacity: 0;
            }

            .guide-banner {
                object-fit: cover;
                border-radius: 5px;
                height: 200px;
                width: 100%;

                /* outline: 2px solid var(--color-200); */
            }

            .guide-header {
                box-sizing: border-box;
                display: flex;
                padding: 15px;
                padding-top: 0px;
            }

            .guide-title {
                font-family: 'JetBrains Mono', monospace;
                color: rgba(255, 255, 255, 0.75);
                font-weight: lighter;
                padding: 0px;
                margin: 0px;
            }

            .guide-content {
                display: flex;
                
            }

            .guide-footer {
                justify-content: space-between;
                box-sizing: border-box;
                display: flex;
                padding: 10px 0px;
            }

            .guide-footer-button {
                font-family: 'JetBrains Mono', monospace;
                color: rgba(255, 255, 255, 0.5);
                font-size: 12px;

                user-select: none;
                cursor: pointer;

                box-sizing: border-box;
                border-radius: 10px;
                padding: 15px;

                outline: 2px solid var(--color-200);
                
                transition: all 100ms ease-in-out;
            }

            .guide-footer-button:hover {
                color: rgba(255, 255, 255, 0.75);
                background: var(--color-200);
            }

        </style>
    </head>

                    <svg class="item-panel-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13M12 17H12.01M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>

        <script>
            const components = [
                [
                    { id: 'and', tooltip: 'and', color: '#304A41', icon: '&' },
                    { id: 'or' , tooltip: 'or' , color: '#4A3D7B', icon: '|' },
                    { id: 'not', tooltip: 'not', color: '#99125C', icon: '~' }
                ],
                [
                    { id: 'lamp'  , tooltip: 'lamp'  , color: '#5B5214', icon: 'l' },
                    { id: 'switch', tooltip: 'switch', color: '#5B5214', icon: 's' }
                ],
                // [
                //     { id: 'delay'    , tooltip: 'delay'    , color: '', icon: 'd' },
                //     { id: 'generator', tooltip: 'generator', color: '', icon: 'g' }
                // ]
            ];

            const selectComponent = document.getElementById('component-select');
            components.forEach((array, index) => {
                array.forEach(({ id, tooltip, color, icon }) => {
                    selectComponent.innerHTML += `<div id="select-${id}" onclick="selectOption({ id: 'select-${id}', type: 'add', value: '${id}' })" class="item-panel item-tooltip" tooltip-text="${tooltip}" style="--color-active: ${color};"><span>${icon}</span></div>`;
                });
                if (index + 1 < components.length) {
                    selectComponent.innerHTML += '<div class="panel-separate"></div>';
                }
            });

            let selectedOption = { id: 'select-move', type: 'move' };
            function selectOption(option) {
                if (selectedOption.id !== option.id) {
                    document.getElementById(selectedOption.id).classList.remove('item-selected');
                    document.getElementById(option.id).classList.add('item-selected');
                    selectedOption = option;
                }
            }

            
            

            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                
                canvas.style.width  = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';

                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;

                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resize);
            resize();

            function animate({ wait, duration, timing, callback, pre, post }) {
                let quit  = false;
                let start = performance.now();

                if (pre !== undefined) {
                    pre();
                }
                requestAnimationFrame(function frame(time) {
                    if (quit) {
                        return;
                    }

                    if (time - start > wait) {
                        let progress = (time - (start + wait)) / duration;
                        if (progress > 1) {
                            progress = 1;
                        }

                        callback(timing(progress));
                        if (progress < 1) {
                            requestAnimationFrame(frame);
                        } else {
                            if (post != undefined) {
                                post();
                            }
                        }
                    } else {
                        requestAnimationFrame(frame);
                    }
                });

                return {
                    quit: () => quit = true
                }
            }

            function animateFrames({ frames, wait, duration, timing, pre, post }) {
                let frame = 0;
                return animate({
                    wait:     wait,
                    duration: duration,
                    timing:   timing,
                    callback: (time) => {
                        frames[frame]();
                        if (time > (frame + 1) / frames.length) {
                            ++frame;
                        }
                    },
                    pre:  pre,
                    post: post
                });
            }   

            class NumberAnimate {
                constructor(init, timing) {
                    this.value = init;
                    this.timing = timing;
                    
                    this.holder = undefined;
                }

                to({ value, duration, pre, post }) {
                    if (this.holder !== undefined) {
                        this.holder.quit();
                    }

                    let start = this.value;
                    let delta = value - this.value;
                    this.holder = animate({
                        wait:  0,
                        duration: duration,
                        timing:   this.timing,
                        callback: (time) => this.value = start + delta * time,
                        pre:  () => {
                            if (pre !== undefined) {
                                pre();
                            }
                        },
                        post: () => {
                            this.holder = undefined
                            if (post !== undefined) {
                                post();
                            }
                        }
                    });
                }

                stop() {
                    if (this.holder !== undefined) {
                        this.holder.quit();
                    }
                }

                set(value) {
                    this.value = value;
                }

                get() {
                    return this.value;
                }
            }

            const bump = (a, b, c) => (time) => a * time * Math.cos(Math.PI * b * time) + c * time;

            function drawLine(x1, y1, x2, y2) {
                ctx.beginPath();       
                ctx.moveTo(x1, y1);      
                ctx.lineTo(x2, y2);  
                ctx.stroke();
            }

            function drawCircle(x, y, radius, color) {
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, 2 * Math.PI);
                ctx.fill();
            }

            function drawText({ pos, text, fontSize, color }) {
                ctx.font = `${fontSize} 'JetBrains Mono'`;
                ctx.fillStyle    = color;
                ctx.textAlign    = 'center'; 
                ctx.textBaseline = 'middle'; 
                ctx.fillText(text, pos.getX(), pos.getY());
            }

            function drawEmptyBlock({ pos, size, lineWidth, color }) {
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = color;
                ctx.strokeRect(pos.getX() - size / 2, pos.getY() - size / 2, size, size);
                drawLine(pos.getX() - size / 2, pos.getY() - size / 2, pos.getX() + size / 2, pos.getY() + size / 2);
                drawLine(pos.getX() - size / 2, pos.getY() + size / 2, pos.getX() + size / 2, pos.getY() - size / 2);
            }

            function drawLinesBlock({ pos, size, lineWidth, lineCount, color }) {
                ctx.lineWidth   = lineWidth;
                ctx.strokeStyle = color;
                for (let i = 0; i < lineCount; ++i) {
                    drawLine(
                        pos.getX() - size / 2,
                        pos.getY() - size / 2 + i * (size / lineCount),
                        pos.getX() - size / 2 + i * (size / lineCount),
                        pos.getY() - size / 2
                    );
                }
                for (let i = 0; i < lineCount; ++i) {
                    drawLine(
                        pos.getX() - size / 2 + i * (size / lineCount),
                        pos.getY() + size / 2,
                        pos.getX() + size / 2,
                        pos.getY() - size / 2 + i * (size / lineCount) 
                    ); 
                }
            }

            function drawFillBlock({ pos, size, icon, color }) {
                ctx.fillStyle = color;
                ctx.fillRect(pos.getX() - size / 2, pos.getY() - size / 2, size, size);
                icon();
            }

            function drawOffComponent({ pos, size, lineWidth, icon, colors }) {      
                ctx.fillStyle = colors.color100;
                ctx.fillRect(pos.getX() - size / 2, pos.getY() - size / 2, size, size);
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = colors.color200;
                ctx.strokeRect(pos.getX() - size / 2, pos.getY() - size / 2, size, size);
                ctx.fillStyle = colors.color300;
                drawCircle(pos.getX() - size / 2, pos.getY() - size / 2, 4);
                drawCircle(pos.getX() - size / 2, pos.getY() + size / 2, 4);
                drawCircle(pos.getX() + size / 2, pos.getY() - size / 2, 4);
                drawCircle(pos.getX() + size / 2, pos.getY() + size / 2, 4);
                icon();
            }

            function drawOnComponent({ pos, size, lineWidth, lineCount, icon, colors }) {
                ctx.shadowColor = `${colors.color300}${Math.floor(255 * 0.20).toString(16)}`; 
                ctx.shadowBlur  = 50;     

                ctx.fillStyle = colors.color100;
                ctx.fillRect(pos.getX() - size / 2, pos.getY() - size / 2, size, size);
                drawLinesBlock({ pos: pos, size: size, lineWidth: lineWidth, lineCount: lineCount, color: colors.color200 });
                ctx.lineWidth = lineWidth;
                ctx.strokeStyle = colors.color200;
                ctx.strokeRect(pos.getX() - size / 2, pos.getY() - size / 2, size, size);
                icon();

                ctx.shadowBlur = 0;
            }

            class Point {
                constructor(x, y) {
                    this.x = x;
                    this.y = y;
                }

                set(x, y) {
                    this.x = x;
                    this.y = y;
                }

                move(dx, dy) {
                    this.x += dx;
                    this.y += dy;
                }

                getX() {
                    return Math.floor(this.x);
                }

                getY() {
                    return Math.floor(this.y);
                }
            }

            class FollowPoint {
                constructor(follow, dx, dy) {
                    this.follow = follow;
                    this.dx = dx;
                    this.dy = dy;
                }

                getX() {
                    return Math.floor(this.dx) + this.follow.getX();
                }

                getY() {
                    return Math.floor(this.dy) + this.follow.getY();
                }
            }


            class Component {
                constructor(pos, size, style) {
                    this.pos   = pos;
                    this.size  = size;
                    this.style = style;
                    
                    this.state = false;
                    
                    this.input  = new Socket(this, 'input');
                    this.output = new Socket(this, 'output');

                    this.animate = false;
                    this.hover   = {
                        visible: false,
                        size:    new NumberAnimate(0, (time) => time)
                    };
                    
                    uievent.notice(this, 0);
                }

                // evaluate

                reset() {
                    this.state = false;
                }

                evaluate(args, time) {

                }

                // events

                move(dx, dy, event) {
                    this.pos.move(dx, dy);
                }

                click(event) {
                    
                }

                hoveron(event) {
                    this.hover.size.to({
                        value:    4,
                        duration: 200,
                        pre:      () => this.hover.visible = true
                    });
                }

                hoveroff(event) {
                    this.hover.size.to({
                        value:    0,
                        duration: 200,
                        post:     () => this.hover.visible = false
                    })
                }

                // predicate

                collision(x, y) {
                    return Math.abs(x - this.pos.getX()) <= this.size / 2 &&
                            Math.abs(y - this.pos.getY()) <= this.size / 2;
                }

                // draw

                draw(time) {
                    if (!this.animate) {
                        this.drawDefault(time);
                    }
                    if (this.hover.visible) {
                        this.drawHover(time);
                    }
                    if (this.selected) {
                        this.drawSelect(time);
                    }
                    if (this.input !== undefined) {
                        this.input.draw(time);
                    }
                    if (this.output !== undefined) {
                        this.output.draw(time);
                    }
                }

                drawDefault(time) {
                    if (this.state) {
                        drawOnComponent({
                            pos:       this.pos,
                            size:      this.size,
                            lineWidth: 2,
                            lineCount: 10,
                            colors:    this.style.enable,
                            icon:      () => this.style.icon(this.pos, '#ffffff', this.state)
                        });
                    } else {
                        drawOffComponent({
                            pos:       this.pos,
                            size:      this.size,
                            lineWidth: 2,
                            colors:    this.style.disable,
                            icon:      () => this.style.icon(this.pos, '#ffffff', this.state)
                        });
                    }
                    drawText({
                        pos:      new Point(this.pos.getX(), this.pos.getY() + this.size / 2 + 15),
                        text:     this.style.text,
                        fontSize: '16px',
                        color:    'rgba(255, 255, 255, 0.25)'
                    });
                }

                drawSelect(time) {
                    drawCircle(this.pos.getX() - this.size / 2, this.pos.getY() - this.size / 2, 6, '#386AD7');
                    drawCircle(this.pos.getX() - this.size / 2, this.pos.getY() + this.size / 2, 6, '#386AD7');
                    drawCircle(this.pos.getX() + this.size / 2, this.pos.getY() - this.size / 2, 6, '#386AD7');
                    drawCircle(this.pos.getX() + this.size / 2, this.pos.getY() + this.size / 2, 6, '#386AD7');

                    ctx.strokeStyle = '#386AD7';
                    ctx.strokeRect(this.pos.getX() - this.size / 2, this.pos.getY() - this.size / 2, this.size, this.size);
                }

                drawHover(time) {
                    drawCircle(this.pos.getX() - this.size / 2, this.pos.getY() - this.size / 2, this.hover.size.get(), '#386AD7');
                    drawCircle(this.pos.getX() - this.size / 2, this.pos.getY() + this.size / 2, this.hover.size.get(), '#386AD7');
                    drawCircle(this.pos.getX() + this.size / 2, this.pos.getY() - this.size / 2, this.hover.size.get(), '#386AD7');
                    drawCircle(this.pos.getX() + this.size / 2, this.pos.getY() + this.size / 2, this.hover.size.get(), '#386AD7');
                }
            }

            class Gate extends Component {
                static DEFAULT_SIZE = 70;
                static TICK         = 25;

                constructor(pos, expr, style) {
                    super(pos, Gate.DEFAULT_SIZE, style);
                    this.expr = expr;
                    
                    this.tick = undefined;
                }

                // eval

                evaluate(args, time) {
                    let state = this.expr(args, time);
                    if (state) {
                        this.tick = animate({
                            wait:     Gate.TICK,
                            duration: 2,
                            timing:   (time) => time,
                            callback: (time) => {  },

                            post: () => {
                                this.state = true;
                                this.tick  = undefined;
                            }
                        });
                    } else {
                        this.tick = animate({
                            wait:     Gate.TICK,
                            duration: 2,
                            timing:   (time) => time,
                            callback: (time) => {  },
                            
                            post: () => {
                                this.state = false;
                                this.tick  = undefined;
                            }
                        });
                    }
                }
            }

            class Lamp extends Component {
                static DEFAULT_SIZE = 70;

                constructor(pos) {
                    super(pos, Lamp.DEFAULT_SIZE, {
                        text: 'lamp',
                        icon: () => { },
                        disable: { color100: '#050505', color200: '#444444', color300: '#828282' },
                        enable:  { color100: '#EEDC5E', color200: '#6B632B', color300: '#EEDC5E' }
                    });
                    this.output = undefined;
                }

                evaluate(args, time) {
                    this.state = args.reduce((a, b) => a && b);
                }
            }

            class Switch extends Component {
                static DEFAULT_SIZE = 70;

                constructor(pos) {
                    super(pos, Switch.DEFAULT_SIZE, {
                        text: 'switch',
                        icon: () => { },
                        disable: { color100: '#050505', color200: '#444444', color300: '#828282' },
                        enable:  { color100: '#EEDC5E', color200: '#6B632B', color300: '#EEDC5E' }
                    });
                    this.input = undefined;
                }

                click(event, time) {
                    this.state = !this.state;
                }
            }

            class Generator extends Component {
                static DEFAULT_SIZE = 70;

                constructor(pos) {
                    super(pos, Generator.DEFAULT_SIZE, {
                        text: 'switch',
                        icon: () => { },
                        disable: { color100: '#050505', color200: '#444444', color300: '#828282' },
                        enable:  { color100: '#EEDC5E', color200: '#6B632B', color300: '#EEDC5E' }
                    });
                    this.input = undefined;
                }
            }

            class Socket {
                static DEFAULT_SIZE = 12;
                static HOVER_SIZE   = 18; 

                constructor(component, type) {
                    this.pos  = new FollowPoint(component.pos, (type === 'input' ? -1 : 1) * component.size / 2, 0);
                    this.size = new NumberAnimate(Socket.DEFAULT_SIZE, (time) => time);

                    this.component = component;
                    this.type      = type;

                    uievent.notice(this, 1);
                }

                // events

                hoveron(event) {
                    this.size.to({
                        value:    Socket.HOVER_SIZE,
                        duration: 200
                    });
                }

                hoveroff(event) {
                    this.size.to({
                        value:    Socket.DEFAULT_SIZE,
                        duration: 200
                    });
                }

                // predicate

                collision(x, y) {
                    let dx = x - this.pos.getX();
                    let dy = y - this.pos.getY();

                    return dx * dx + dy * dy <= this.size.get() * this.size.get(); 
                }

                // draw

                draw(time) {
                    let color = this.component.state ? 
                        this.component.style.enable.color300 :
                        this.component.style.disable.color300;
                    drawCircle(this.pos.getX(), this.pos.getY(), this.size.get() / 2, color);
                }
            }

            class Pipe {
                constructor(compstart, compend, start, end) {
                    this.compstart = compstart;
                    this.compend   = compend;
                    this.start     = start;
                    this.end       = end;

                    this.state = compstart !== undefined ? compstart.state : false;

                    this.route   = [ ];
                    this.animate = {
                        visible: true,
                        value:   new NumberAnimate(0, (time) => time)
                    };
                }

                // predicate

                collision(x, y) {
                    let max = new Point(-Infinity, -Infinity);
                    let min = new Point(Infinity, Infinity);
                    for (const point of this.route) {
                        max.set(Math.max(max.getX(), point.getX()), Math.max(max.getY(), point.getY()));
                        min.set(Math.min(min.getX(), point.getX()), Math.min(min.getY(), point.getY()));
                    }

                    return min.getX() < x + 15 && x - 15 < max.getX() &&
                            min.getY() < y + 15 && y - 15 < max.getY();
                }

                // draw

                prepareDraw(time) {
                    if (this.compstart !== undefined) {
                        this.state = this.compstart.state;
                    }

                    if (this.start.getX() + 50 < this.end.getX()) {
                        if (Math.abs(this.start.getY() - this.end.getY()) < 10e-5) {
                            this.route = [
                                this.start,
                                this.end
                            ];
                        } else {
                            this.route = [
                                this.start,
                                new Point((this.start.getX() + this.end.getX()) / 2, this.start.getY()),
                                new Point((this.start.getX() + this.end.getX()) / 2, this.end.getY()),
                                this.end
                            ];
                        }
                    } else {
                        this.route = [
                            this.start,
                            new Point(this.start.getX() + 25, this.start.getY()),
                            new Point(this.start.getX() + 25, (this.start.getY() + this.end.getY()) / 2),
                            new Point(this.end.getX()   - 25, (this.start.getY() + this.end.getY()) / 2),
                            new Point(this.end.getX()   - 25, this.end.getY()),
                            this.end
                        ];
                    }
                }

                drawLine(time) {
                    ctx.beginPath();
                    ctx.moveTo(this.route[0].getX(), this.route[0].getY());
                    for (let i = 1; i < this.route.length; ++i) {
                        ctx.lineTo(this.route[i].getX(), this.route[i].getY());
                    }

                    if (!this.state) {
                        ctx.lineWidth   = 2;
                        ctx.strokeStyle = '#050505';
                        ctx.stroke();

                        ctx.lineWidth   = 2;
                        ctx.strokeStyle = '#444444';
                        ctx.setLineDash([ 10, 5 ]);
                        ctx.stroke();
                        ctx.setLineDash([ ]);
                    } else {
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = this.compstart.style.enable.color200;
                        ctx.stroke();
                    }

                    if (this.animate.visible) {
                        
                    }
                }

                drawPoints(time) {
                    let color = this.state ? this.compstart.style.enable.color200 : '#444444';
                    for (let i = 1; i < this.route.length; ++i) {
                        drawCircle(this.route[i].getX(), this.route[i].getY(), 6, color);
                        drawCircle(this.route[i].getX(), this.route[i].getY(), 4, '#050505');
                    }
                }
            }

            class Network {
                static TICK = 100;

                constructor() {
                    this.components = [ ];
                    this.pipes      = [ ];
                    this.sockets    = [ ];

                    this.connections = new Map();

                    this.pipe  = undefined;
                    this.start = undefined;

                    this.lastTick = performance.now();

                    document.addEventListener('mousemove', (event) => {
                        if (this.pipe !== undefined) { 
                            let x = event.clientX;
                            let y = event.clientY;

                            if (this.pipe.end instanceof FollowPoint) {
                                this.pipe.start.set(x, y);
                            } else {
                                this.pipe.end.set(x, y);
                            }
                        }
                    });
                }

                // eval

                evaluate(time) {
                    let evals = new Set();
                    const next = (component) => {
                        if (!evals.has(component)) {
                            evals.add(component);

                            let connect = this.connections.get(component);
                            if (connect !== undefined) {
                                component.evaluate([...connect].map(e => next(e).state), time);
                            }
                        }

                        return component;
                    };
                    this.components.filter(e => e instanceof Lamp).forEach(lamp => next(lamp));
                    this.components.filter(e => e instanceof Gate).forEach(gate => next(gate));
                }

                // add elements

                pushGate(pos, expr, style) {
                    let gate = new Gate(pos, expr, style);

                    this.setSocketEvent(gate.input);
                    this.setSocketEvent(gate.output);

                    this.components.push(gate);
                    this.sockets.push(gate.input, gate.output);
                }

                pushLamp(pos) {
                    let lamp = new Lamp(pos);

                    this.setSocketEvent(lamp.input);
                    
                    this.components.push(lamp);
                    this.sockets.push(lamp.input);
                }

                pushSwitch(pos) {
                    let swtch = new Switch(pos);

                    this.setSocketEvent(swtch.output);

                    this.components.push(swtch);
                    this.sockets.push(swtch.output);
                }

                // delete element

                deleteElement(element) {
                    
                }

                // pipeline
                
                setSocketEvent(socket) {
                    socket.mousedown = (event) => {
                        this.pipe = socket.type === 'input' ?
                                            new Pipe(undefined, socket.component, new Point(event.clientX, event.clientY), socket.pos) :
                                            new Pipe(socket.component, undefined, socket.pos, new Point(event.clientX, event.clientY));
                        this.start = socket;
                    };
                    socket.mouseup = (event) => {
                        let finded = this.sockets.find(e => e.collision(event.clientX, event.clientY));
                        if (finded !== undefined && socket.type !== finded.type) {
                            if (socket.type === 'output') {
                                this.linkingComponents(socket, finded);
                            } else {
                                this.linkingComponents(finded, socket);
                            }
                        }

                        this.pipe  = undefined;  
                        this.start = undefined;
                    };
                }

                linkingComponents(output, input) {
                    let possible = true;
                    let connection = this.connections.get(input.component);
                    if (connection === undefined) {
                        this.connections.set(input.component, new Set([ output.component ]));
                    } else {
                        possible = !connection.has(output.component);
                        if (possible) {
                            connection.add(output.component);
                        }
                    }

                    if (possible) {
                        this.pipes.push(new Pipe(output.component, input.component, output.pos, input.pos));
                    }
                }

                // draw

                tick(time) {
                    // if (time - this.lastTick > Network.TICK) {
                        this.evaluate(time);
                        // this.lastTick = time;
                    // }
                }

                draw(time) {
                    let pipes = this.pipe === undefined ? this.pipes : [this.pipe, ...this.pipes];
                    pipes.forEach(pipe => pipe.prepareDraw(time));
                    pipes = pipes.sort((a, b) => a.state - b.state);

                    pipes.forEach(pipe => pipe.drawLine(time));
                    pipes.forEach(pipe => pipe.drawPoints(time));

                    this.components.forEach(e => e.draw());
                }
            }

            const AND_STYLE = {
                text: 'and',
                icon: (pos, color) => drawText({
                    pos: pos,
                    text: '&',
                    fontSize: '30px',
                    color: color
                }),
                disable: { color100: '#050505', color200: '#444444', color300: '#828282' },
                enable:  { color100: '#304A41', color200: '#445C54', color300: '#7EBDAE' }
            };

            const OR_STYLE = {
                text: 'or',
                icon: (pos, color) => drawText({
                    pos: pos,
                    text: '|',
                    fontSize: '30px',
                    color: color
                }),
                disable: { color100: '#050505', color200: '#444444', color300: '#828282' },
                enable:  { color100: '#4A3D7B', color200: '#674C9E', color300: '#9A74DE' }
            };

            const NOT_STYLE = {
                text: 'not',
                icon: (pos, color) => drawText({
                    pos:  pos,
                    text: '~',
                    fontSize: '30px',
                    color: color
                }),
                disable: { color100: '#050505', color200: '#444444', color300: '#828282' },
                enable:  { color100: '#99125C', color200: '#AA3274', color300: '#DA1580' }
            }

            class Events {
                constructor(canvas) {
                    this.objects = [ ];

                    this.canvas = canvas;

                    this.mousemoveListeners = [ ];
                    this.mousedownListeners = [ ];
                    this.mouseupListeners   = [ ];
                    this.keydownListeners   = [ ];

                    document.addEventListener('keydown', (event) => {
                        this.keydownListeners.forEach(({ listener }) => listener(event));
                    });
                    document.addEventListener('mousemove', (event) => {
                        this.mousemoveListeners.forEach(({ listener }) => listener(event));
                    });
                    document.addEventListener('mousedown', (event) => {
                        this.mousedownListeners.forEach(({ listener }) => listener(event));
                    });
                    document.addEventListener('mouseup', (event) => {
                        this.mouseupListeners.forEach(({ listener }) => listener(event));
                    });

                    // select

                    this.selection = true;

                    this.selected = new Set();
                    this.pressed  = false;
                    this.lastMouseMove = undefined;

                    this.add('mousedown', (event) => {
                        if (document.elementFromPoint(event.clientX, event.clientY) !== canvas || !this.selection) {
                            return;
                        }

                        this.pressed = true;

                        let select = this.objects.filter(({ object }) => object.collision(event.clientX, event.clientY))
                                            .sort((a, b) => b.index - a.index)[0];
                        if (select !== undefined) {
                            if (!event.shiftKey && !this.selected.has(select.object)) {
                                this.selected.forEach(e => e.selected = false);
                                this.selected.clear();
                            }

                            if (event.shiftKey) {
                                select.object.selected = !select.object.selected;
                                this.selected.has(select.object) ?
                                    this.selected.delete(select.object) :
                                    this.selected.add(select.object);
                            } else {
                                select.object.selected = true;
                                this.selected.add(select.object);
                            }

                            if (select.object.selected) {
                                Events.invoke(select.object, 'selecton', event);
                            } else {
                                Events.invoke(select.object, 'selectoff', event);
                            }
                        } else {
                            if (!event.shiftKey) {
                                this.selected.forEach(e => e.selected = false);
                                this.selected.clear();
                            }
                        }
                    }, 1);
                    this.add('mouseup', (event) => {
                        this.pressed = false;
                        this.selected.forEach(object => {
                            if (object.moving) {
                                Events.invoke(object, 'moveoff', event);
                            }
                            object.moving = false;
                        });
                    }, 1);
                    this.add('mousemove', (event) => {
                        if (this.lastMouseMove === undefined) {
                            this.lastMouseMove = new Point(event.clientX, event.clientY);
                        }

                        if (this.pressed) {
                            this.selected.forEach(object => {
                                if (!object.moving) {
                                    Events.invoke(object, 'moveon', event);
                                }

                                object.moving = true;
                                Events.invoke(object, 'move', event.clientX - this.lastMouseMove.getX(), event.clientY - this.lastMouseMove.getY(), event);
                            });
                        }

                        this.lastMouseMove.set(event.clientX, event.clientY);
                    }, 1);

                    // click
                    
                    this.clicking = true;

                    this.add('mouseup', (event) => {
                        if (document.elementFromPoint(event.clientX, event.clientY) !== this.canvas || !this.clicking) {
                            return;
                        }

                        if (!event.shiftKey) {
                            let click = this.objects.filter(({ object }) => object.collision(event.clientX, event.clientY))
                                                .sort((a, b) => b.index - a.index)[0];
                            if (click !== undefined && !click.object.moving) {
                                Events.invoke(click.object, 'click', event);
                            }
                        }
                    }, 0);

                    // hover 

                    this.hovering = true;

                    this.add('mousemove', (event) => {
                        if (this.hovering) {
                            this.objects.forEach(({ object, index }) => {
                                let inside = object.collision(event.clientX, event.clientY);
                                if (object.hovered === undefined) {
                                    object.hovered = false;
                                }
                                if (inside !== object.hovered) {
                                    object.hovered = inside;
                                    if (inside) {
                                        Events.invoke(object, 'hoveron', event);
                                    } else {
                                        Events.invoke(object, 'hoveroff', event);
                                    }
                                }
                            });
                        }
                    }, 0);

                    // mousedown/mouseup

                    this.mousedownup = true;

                    this.add('mousedown', (event) => {
                        if (document.elementFromPoint(event.clientX, event.clientY) !== this.canvas || !this.clicking) {
                            return;
                        }

                        this.objects.forEach(({ object, index }) => {
                            if (object.collision(event.clientX, event.clientY)) {
                                Events.invoke(object, 'mousedown', event);
                                object.pressed = true;
                            }
                        });
                    }, 0);
                    this.add('mouseup', (event) => {
                        this.objects.forEach(({ object, index }) => {
                            if (object.pressed) {
                                Events.invoke(object, 'mouseup', event);
                                object.pressed = false;
                            }
                        });
                    }, 0);
                }

                static invoke(object, method, ...args) {
                    if (object[method] !== undefined) {
                        object[method](...args);
                    }
                }

                add(event, listener, priority) {
                    this[event + 'Listeners'].push({ listener: listener, priority: priority });
                    this[event + 'Listeners'] = this[event + 'Listeners'].sort((a, b) => a.priority - b.priority);
                }

                notice(object, index) {
                    this.objects.push({ object: object, index: index });
                }
            }
            
            const uievent = new Events(canvas);
            const network = new Network();

            network.pushGate(new Point(300, 300), (args) => !args.reduce((a, b) => a || b), NOT_STYLE);
            network.pushGate(new Point(100, 100), (args) => args.reduce((a, b) => a && b), AND_STYLE);
            network.pushGate(new Point(300, 100), (args) => args.reduce((a, b) => a || b), OR_STYLE);
            network.pushGate(new Point(500, 300), (args) => args.reduce((a, b) => a || b), OR_STYLE);
            network.pushLamp(new Point(500, 100));
            network.pushSwitch(new Point(100, 300));
            network.pushSwitch(new Point(100, 500));

            function frame(time) {
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                network.tick(time);
                network.draw();
                
                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
            
        
            
        </script>
