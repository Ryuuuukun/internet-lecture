<html>
    <head>
        <link href="https://googleapis.com" rel="stylesheet">

        <style>
            @import url('https://fonts.googleapis.com/css2?family=Marck+Script&display=swap');

            body {
                margin: 0px;
                background: #050505;
            }

            :root {
                --color-100: #050505;
                --color-150: #0B0B0B;
                --color-200: #181818;   
                --color-300: #232323;
                --color-400: #ffffff;
                --color-active: #386AD7; 

                --tooltip-offset-y: 125%;
                --tooltip-font: 'Roboto-flex', sanf-serif;
            }

            .container {
                background-color: var(--color-200);
                color: var(--color-400);
                box-sizing: border-box;
                border-radius: 10px;
                padding: 15px;
            }

            .container-button {
                font-family: 'JetBrains Mono', monospace;
                background-color: var(--color-200);
                justify-content: center;
                align-items: center;
                border-radius: 5px;
                display: flex;
            }

            .select-action-panel {
                box-sizing: border-box;  
                position: absolute;
                
                display: flex;
                
                gap: 10px;
                bottom: 50px;
                left: 50%;

                z-index: 1;

                transform: translate(-50%, 0px);

                transition: all 500ms cubic-bezier(0.68, 0.01, 0.29, 1);
            }

            .select-panel-hidden {
                transform: translate(-50%, 30px);
                opacity:   0;
            }
 
            .panel {
                height: fit-content;
                width:  fit-content;
                display: flex;
                gap: 10px;

                background: var(--color-150);
                padding: 10px;
                border-radius: 20px;
            }

            .panel-separate {
                width: 2px;
                margin: 5px 5px;
                background: var(--color-200);
            }

            .item-panel {
                box-sizing: border-box;
                border-radius: 10px;
                width:  40px;
                height: 40px;

                display: flex;
                justify-content: center;
                align-items: center;

                cursor: pointer;
                user-select: none; 

                color: rgba(255, 255, 255, 0.5);
                font-family: 'JetBrains Mono', monospace;
                font-size: 18px;

                outline: 2px solid var(--color-200);

                background-color: rgba(255, 255, 255, 0.01);
                backdrop-filter: blur(10px);

                transition: all 100ms ease-in-out;
            }

            .item-panel-icon {
                width:  20px;
                height: 20px;
                
                stroke: rgba(255, 255, 255, 0.5);

                transition: all 100ms ease-in-out;
            }
            
            .item-panel:hover {
                background-color: var(--color-200);
                color: rgba(255, 255, 255, 0.75);
            }

            .item-panel:hover .item-panel-icon {
                stroke: rgba(255, 255, 255, 0.75);
            }

            .item-panel:active {
                background: none;
                color: rgba(255, 255, 255, 1);
            }

            .item-panel:active .item-panel-icon {
                stroke: rgba(255, 255, 255, 1);
            }

            .item-tooltip {
                position: relative;
            }

            .item-tooltip::before {
                content: attr(tooltip-text);
                position: absolute;
                bottom: var(--tooltip-offset-y);
                left: 50%;
                transform: translateX(-50%); 
                
                padding: 8px 12px;
                font-family: 'JetBrains Mono', monospace;
                font-weight: lighter;
                color: #fff;
                background-color: var(--color-200);
                font-size: 14px;
                white-space: nowrap;
                border-radius: 5px;

                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s ease;
            }

            .item-tooltip:hover::before {
                opacity: 1;
            }

            .item-selected {
                background: var(--color-active);
                color: rgba(255, 255, 255, 1);
            }

            .item-selected .item-panel-icon {
                stroke: rgba(255, 255, 255, 1);
            }

            .item-selected:hover {
                background: var(--color-active);   
            }

            .item-selected:hover .item-panel-icon {
                stroke: white;
            }


            /* -------- file panel -------- */
            
            .file-panel {
                position: absolute;
                left: 50px;
                top: 30px;

                display: flex;
                gap: 5px;
                
                transition: all 500ms cubic-bezier(0.68, 0.01, 0.29, 1);
            }
            
            .file-panel-hidden {
                transform: translate(0, -30px);
                opacity:   0;
            }

            /* -------- guide -------- */
            
            .guide {
                position: absolute;
                bottom: 120px;
                left: 50%;
                
                width: 470px;
                height: 500px;
                border-radius: 20px;
                
                box-sizing: border-box;
                padding: 10px;
                
                background: var(--color-150);
                
                transform: translate(-50%, 0);
                
                transition: all 200ms cubic-bezier(0.68, 0.01, 0.29, 1);
            }            
            
            .guide-hidden {
                transform: translate(-50%, 30px);
                pointer-events: none;
                user-select: none;
                opacity:   0;
            }
            
            .guide-banner {
                border-radius: 10px;
                object-fit: cover;
                height: 230px;
                width: 100%;
                
                user-select: none;
            }
            
            .guide-content {
                font-family: 'Roboto Flex', sans-serif;
                color: rgba(255, 255, 255, 0.75);
            }
            
            /* -------- shortcuts -------- */

            .shortcuts {
                position: absolute;
                bottom: 50px;
                left: 50px;

                transition: opacity 300ms cubic-bezier(0.68, 0.01, 0.29, 1);
            }

            .shortcuts-hidden {
                opacity: 0;
            }

            .item-shortcut {
                display: flex;
                align-items: center;

                font-family: 'Roboto Flex', sans-serif;
                color: rgba(255, 255, 255, 0.4);

                user-select: none;
                
                gap: 10px;
            }

            .item-shortcut:not(:last-child) {
                margin-bottom: 10px;
            }

            .shortcut-button {
                height: fit-content;
                border-radius: 10px;
                padding: 5px 10px;
                
                outline: 2px solid var(--color-300);
                border: none;

                background-color: rgba(255, 255, 255, 0.01);
                backdrop-filter: blur(10px);
                
                font-family: 'JetBrains Mono', monospace;
                color: rgba(255, 255, 255, 0.5);
                font-weight: bold;
                font-size: 12px;

                user-select: none;
                cursor: pointer;
                
                transition: all 100ms ease-in-out;
            }

            .shortcut-button:active, .shortcut-button:focus {
                transform: translateY(5px);
            }     

        </style>
    </head>
    <body>
        <canvas id="canvas" style="background: #050505;" width="800" height="800"></canvas>
        
        <div id="select-action-panel" class="select-action-panel select-panel-hidden">
            <div id="action-select" class="panel">
                <div id="select-interact" onclick="selectActionOption(InteractOption)" class="item-panel item-tooltip" tooltip-text="Interact  Q">
                    <svg class="item-panel-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20.5056 10.7754C21.1225 10.5355 21.431 10.4155 21.5176 10.2459C21.5926 10.099 21.5903 9.92446 21.5115 9.77954C21.4205 9.61226 21.109 9.50044 20.486 9.2768L4.59629 3.5728C4.0866 3.38983 3.83175 3.29835 3.66514 3.35605C3.52029 3.40621 3.40645 3.52004 3.35629 3.6649C3.29859 3.8315 3.39008 4.08635 3.57304 4.59605L9.277 20.4858C9.50064 21.1088 9.61246 21.4203 9.77973 21.5113C9.92465 21.5901 10.0991 21.5924 10.2461 21.5174C10.4157 21.4308 10.5356 21.1223 10.7756 20.5054L13.3724 13.8278C13.4194 13.707 13.4429 13.6466 13.4792 13.5957C13.5114 13.5506 13.5508 13.5112 13.5959 13.479C13.6468 13.4427 13.7072 13.4192 13.828 13.3722L20.5056 10.7754Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div id="select-move" onclick="selectActionOption(EditOption)" class="item-panel item-tooltip item-selected" tooltip-text="Edit  E">
                    <svg class="item-panel-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 9L2 12M2 12L5 15M2 12H22M9 5L12 2M12 2L15 5M12 2V22M15 19L12 22M12 22L9 19M19 9L22 12M22 12L19 15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
            <div id="component-select" class="panel">
                <!-- later init -->
            </div>
            <div id="info-block" onclick="document.getElementById('guide').classList.toggle('guide-hidden')" class="panel" style="background: none;">
                <div class="item-panel item-tooltip" style="border-radius: 20px;" tooltip-text="guide">
                    <svg class="item-panel-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M9.09 9C9.3251 8.33167 9.78915 7.76811 10.4 7.40913C11.0108 7.05016 11.7289 6.91894 12.4272 7.03871C13.1255 7.15849 13.7588 7.52152 14.2151 8.06353C14.6713 8.60553 14.9211 9.29152 14.92 10C14.92 12 11.92 13 11.92 13M12 17H12.01M22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 6.47715 6.47715 2 12 2C17.5228 2 22 6.47715 22 12Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>

        <div id="guide" class="guide guide-hidden">
            <img class="guide-banner" src="static/source/gates-test.gif" alt="">
            <div class="guide-content">
                Гайд
            </div>
        </div>

        <div id="file-panel" class="file-panel file-panel-hidden">
            <div class="panel">
                <div class="item-panel item-tooltip" tooltip-text="На главную" style="--tooltip-offset-y: -125%;">
                    <svg class="item-panel-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 10.5653C3 9.99094 3 9.70376 3.07403 9.4393C3.1396 9.20503 3.24737 8.98469 3.39203 8.7891C3.55534 8.5683 3.78202 8.39199 4.23539 8.03937L11.0177 2.76424C11.369 2.49099 11.5447 2.35436 11.7387 2.30184C11.9098 2.2555 12.0902 2.2555 12.2613 2.30184C12.4553 2.35436 12.631 2.49099 12.9823 2.76424L19.7646 8.03937C20.218 8.39199 20.4447 8.5683 20.608 8.7891C20.7526 8.98469 20.8604 9.20503 20.926 9.4393C21 9.70376 21 9.99094 21 10.5653V17.8002C21 18.9203 21 19.4804 20.782 19.9082C20.5903 20.2845 20.2843 20.5905 19.908 20.7822C19.4802 21.0002 18.9201 21.0002 17.8 21.0002H6.2C5.07989 21.0002 4.51984 21.0002 4.09202 20.7822C3.71569 20.5905 3.40973 20.2845 3.21799 19.9082C3 19.4804 3 18.9203 3 17.8002V10.5653Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
            <div class="panel" style="background: none;">
                <div class="item-panel item-tooltip" tooltip-text="Сохранить" style="--tooltip-offset-y: -125%;">
                    <svg class="item-panel-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7 3V6.4C7 6.96005 7 7.24008 7.10899 7.45399C7.20487 7.64215 7.35785 7.79513 7.54601 7.89101C7.75992 8 8.03995 8 8.6 8H15.4C15.9601 8 16.2401 8 16.454 7.89101C16.6422 7.79513 16.7951 7.64215 16.891 7.45399C17 7.24008 17 6.96005 17 6.4V4M17 21V14.6C17 14.0399 17 13.7599 16.891 13.546C16.7951 13.3578 16.6422 13.2049 16.454 13.109C16.2401 13 15.9601 13 15.4 13H8.6C8.03995 13 7.75992 13 7.54601 13.109C7.35785 13.2049 7.20487 13.3578 7.10899 13.546C7 13.7599 7 14.0399 7 14.6V21M21 9.32548V16.2C21 17.8802 21 18.7202 20.673 19.362C20.3854 19.9265 19.9265 20.3854 19.362 20.673C18.7202 21 17.8802 21 16.2 21H7.8C6.11984 21 5.27976 21 4.63803 20.673C4.07354 20.3854 3.6146 19.9265 3.32698 19.362C3 18.7202 3 17.8802 3 16.2V7.8C3 6.11984 3 5.27976 3.32698 4.63803C3.6146 4.07354 4.07354 3.6146 4.63803 3.32698C5.27976 3 6.11984 3 7.8 3H14.6745C15.1637 3 15.4083 3 15.6385 3.05526C15.8425 3.10425 16.0376 3.18506 16.2166 3.29472C16.4184 3.4184 16.5914 3.59135 16.9373 3.93726L20.0627 7.06274C20.4086 7.40865 20.5816 7.5816 20.7053 7.78343C20.8149 7.96237 20.8957 8.15746 20.9447 8.36154C21 8.59171 21 8.8363 21 9.32548Z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="item-panel item-tooltip" tooltip-text="Загрузить" style="--tooltip-offset-y: -125%;">
                    <svg class="item-panel-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M21 15V16.2C21 17.8802 21 18.7202 20.673 19.362C20.3854 19.9265 19.9265 20.3854 19.362 20.673C18.7202 21 17.8802 21 16.2 21H7.8C6.11984 21 5.27976 21 4.63803 20.673C4.07354 20.3854 3.6146 19.9265 3.32698 19.362C3 18.7202 3 17.8802 3 16.2V15M17 8L12 3M12 3L7 8M12 3V15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
            </div>
        </div>
        
        <div id="shortcuts" class="shortcuts shortcuts-hidden">
            <!-- later init -->
        </div>

        <script src="static/scripts/nodecore.js"></script>
        <script>
            const canvas = document.getElementById("canvas");
            const ctx    = canvas.getContext("2d");

            function resize() {
                const dpr = window.devicePixelRatio || 1;
                
                canvas.style.width  = window.innerWidth + 'px';
                canvas.style.height = window.innerHeight + 'px';

                canvas.width = window.innerWidth * dpr;
                canvas.height = window.innerHeight * dpr;

                ctx.scale(dpr, dpr);
            }

            window.addEventListener('resize', resize);
            resize();


            const engine = new NodeEngine(ctx, canvas);
            // engine.launch();


            // =========== components ===========
            
            const components = [
                [
                    { id: 'and', tooltip: 'and', color: '#304A41', icon: '&', get: (pos) => new Gate(pos, args =>  args.reduce((a, b) => a && b), AND_STYLE) },
                    { id: 'or' , tooltip: 'or' , color: '#4A3D7B', icon: '|', get: (pos) => new Gate(pos, args =>  args.reduce((a, b) => a || b), OR_STYLE ) },
                    { id: 'not', tooltip: 'not', color: '#99125C', icon: '~', get: (pos) => new Gate(pos, args => !args.reduce((a, b) => a || b), NOT_STYLE) }
                ],
                [
                    { id: 'lamp'  , tooltip: 'lamp'  , color: '#5B5214', icon: 'l', get: (pos) => new Lamp(pos)   },
                    { id: 'switch', tooltip: 'switch', color: '#5B5214', icon: 's', get: (pos) => new Switch(pos) }
                ]
            ];
            
            const selectComponent = document.getElementById('component-select');
            components.forEach((array, index) => {
                array.forEach(({ id, tooltip, color, icon }) => {
                    selectComponent.innerHTML += `<div id="select-${id}" onclick="selectActionOption({ id: 'select-${id}', type: 'add', value: '${id}', preset: AddPreset })" class="item-panel item-tooltip" tooltip-text="${tooltip}" style="--color-active: ${color};"><span>${icon}</span></div>`;
                });
                if (index + 1 < components.length) {
                    selectComponent.innerHTML += '<div class="panel-separate"></div>';
                }
            });


            // =========== select option ===========
            
            const EditPreset = () => {
                engine.events.clicking    = false;
                engine.events.selection   = true;
                engine.events.mousedownup = true;
            };
            
            const InteractPreset = () => {
                engine.events.clicking    = true,
                engine.events.selection   = false;
                engine.events.mousedownup = false;
                
                engine.events.clearSelected();
            };
            
            canvas.addEventListener('mouseup', (event) => {
                if (selectedOption.type === 'add') {
                    let reference = components.flat().find(({ id }) => id === selectedOption.value);
                    if (reference !== undefined) {
                        let compoennt = reference.get(new Point(event.clientX, event.clientY));
                        engine.network.addComponent(compoennt);
                        compoennt.appearance();
                    }

                    selectActionOption(EditOption);
                }
            });
            const AddPreset = () => {
                engine.events.selection   = false;
                engine.events.mousedownup = false;
                engine.events.clicking    = false;
            };
            
            const EditOption     = { id: 'select-move'    , type: 'move'    , preset: EditPreset     };
            const InteractOption = { id: 'select-interact', type: 'interact', preset: InteractPreset };
            
            let selectedOption = EditOption;
            selectedOption.preset();
            
            function selectActionOption(option) {
                if (selectedOption.id !== option.id) {
                    document.getElementById(selectedOption.id).classList.remove('item-selected');
                    document.getElementById(option.id).classList.add('item-selected');
                    selectedOption = option;
                    selectedOption.preset();
                }
            }

            // =========== utility engine ===========
            
            function deleteSelectedComponents() {
                engine.network.deleteComponents([...engine.events.selected]);
            }

            // =========== shortcuts ===========
            
            const shortcuts = [
                { text: 'Взаимодействовать', view: true, icon: 'Q'     , code: 'KeyQ'  , ctrl: false, shift: false, alt: false, action: () => selectActionOption(InteractOption) },
                { text: 'Редактировать'    , view: true, icon: 'E'     , code: 'KeyE'  , ctrl: false, shift: false, alt: false, action: () => selectActionOption(EditOption)     },
                { text: 'Удалить'          , view: true, icon: 'Del'   , code: 'Delete', ctrl: false, shift: false, alt: false, action: () => deleteSelectedComponents()         },
                // { text: 'Выделить все'     , view: true, icon: 'Ctrl A', code: 'KeyA'  , ctrl: true , shift: false, alt: false, action: () => { } },
                
                { view: false, code: 'Escape', ctrl: false, shift: false, alt: false, action: () => selectActionOption(EditOption) }
            ];
            
            const shortcutsContainer = document.getElementById('shortcuts');
            shortcuts.forEach(({ text, view, icon, code }) => {
                if (view) {
                    shortcutsContainer.innerHTML += `<div class="item-shortcut"><button onclick="{ this.blur(); }" id="shortcut-${code}" class="shortcut-button">${icon}</button><span> - ${text}</span></div>`;
                }
            });
            
            document.addEventListener('keydown', (event) => {
                let shortcut = shortcuts.find(({ code, ctrl, shift, alt }) => event.code === code && event.ctrlKey === ctrl && event.shiftKey === shift && event.altKey === alt);
                if (shortcut !== undefined) {
                    shortcut.action();
                    if (shortcut.view) {
                        const button = document.getElementById(`shortcut-${shortcut.code}`);
                        
                        button.focus();
                        setTimeout(() => { button.blur() }, 100);
                    }
                }
            });
            
            // =========== appearance ===========

            setTimeout(() => {
                document.getElementById('select-action-panel').classList.remove('select-panel-hidden');
                document.getElementById('file-panel').classList.remove('file-panel-hidden');    
                document.getElementById('shortcuts').classList.remove('shortcuts-hidden');
            }, 200);
            setTimeout(() => {
                engine.network.appearance();
                engine.launch();
            }, 400);


        </script>
    </body>
</html>
